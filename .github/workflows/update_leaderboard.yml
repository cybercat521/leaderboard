name: Update Table30 V2 Leaderboard

on:
  schedule:
    # 每小时第 15 分钟运行（UTC 和北京时间的分钟数相同）
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - data/table30-v2-task-tags.json
      - .github/workflows/update_leaderboard.yml

permissions:
  contents: write

concurrency:
  group: update-table30-v2-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify chart aggregation and updater behavior
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Fetch Table30 V2 and update READMEs and charts
        run: python scripts/update_leaderboard.py

      - name: Commit and push if leaderboard or charts changed
        run: |
          git add README.md README.zh-CN.md assets/table30-v2-*.svg data/table30-v2-*.csv
          if git diff --cached --quiet; then
            echo "No leaderboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Table30 V2 leaderboard" \
            -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push
